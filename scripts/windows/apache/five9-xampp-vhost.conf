# Five9 on Windows 11 + XAMPP + WSL
# Modules to enable in XAMPP Apache:
#   proxy_module
#   proxy_http_module
#   rewrite_module
#
# Replace every C:/path/to/five9 with your real repo path in Windows.
# Backend/API remains in WSL on http://127.0.0.1:3001

<VirtualHost *:80>
    ServerName five9.local
    DocumentRoot "C:/path/to/five9/web/dist"

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass "/api/" "http://127.0.0.1:3001/api/"
    ProxyPassReverse "/api/" "http://127.0.0.1:3001/api/"

    <Directory "C:/path/to/five9/web/dist">
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    Alias "/backup-api" "C:/path/to/five9/web/api"
    <Directory "C:/path/to/five9/web/api">
        Options FollowSymLinks
        AllowOverride None
        DirectoryIndex calls_endpoint.php
        Require all granted
    </Directory>

    Alias "/backup-ingest" "C:/path/to/five9/backup-php"
    <Directory "C:/path/to/five9/backup-php">
        Options FollowSymLinks
        AllowOverride None
        DirectoryIndex ingest.php
        Require all granted
    </Directory>

    ErrorLog "logs/five9-error.log"
    CustomLog "logs/five9-access.log" combined
</VirtualHost>
